services:
  - type: web
    name: release-checklist
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm run prisma:generate --prefix server && npm run prisma:deploy --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
